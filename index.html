<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Анды и Бразилия — 16 дней</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root { --bg:#0d1117; --card:#161b22; --line:#30363d; --accent:#f0883e; --text:#e6edf3; --dim:#8b949e; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  header { padding:14px 20px; display:flex; align-items:center; gap:14px; border-bottom:1px solid var(--line); }
  header h1 { font-size:1.15rem; margin:0; }
  header .sub { color:var(--dim); font-size:.85rem; }
  a { color:#58a6ff; }
  #map { position:fixed; top:57px; left:0; right:0; bottom:0; z-index:0; background:#0a0d12; }
  #panel { position:fixed; z-index:1000; right:14px; top:71px; width:340px; max-height:calc(100vh - 90px); overflow:auto;
           background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; display:none; }
  #panel h2 { margin:0 0 2px; font-size:1.05rem; }
  #panel .day { color:var(--accent); font-size:.8rem; font-weight:600; text-transform:uppercase; letter-spacing:.05em; }
  #panel ul { margin:10px 0 0; padding-left:0; list-style:none; }
  #panel li { margin:7px 0; font-size:.9rem; line-height:1.4; }
  #panel li::before { content:"\U0001F4CD"; margin-right:6px; }
  #panel .close { position:absolute; top:8px; right:10px; cursor:pointer; color:var(--dim); font-size:1.1rem; }
  #legend { position:fixed; z-index:1000; left:14px; bottom:14px; background:var(--card); border:1px solid var(--line);
            border-radius:8px; padding:10px 12px; font-size:.8rem; color:var(--dim); }
  #legend .fly { color:#f0883e; } #legend .ground { color:#58a6ff; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background:var(--card); color:var(--text); }
  @media (max-width:720px){ #panel{ width:calc(100vw - 28px); right:14px; } }
</style>
</head>
<body>
<header>
  <h1>🗺️ Анды и Бразилия</h1>
  <span class="sub">16 дней · кликни точку на карте — увидишь список достопримечательностей со ссылками</span>
</header>
<div id="map"></div>
<div id="panel">
  <span class="close" onclick="document.getElementById('panel').style.display='none'">✕</span>
  <div class="day" id="p-day"></div>
  <h2 id="p-title"></h2>
  <ul id="p-list"></ul>
</div>
<div id="legend">— <span class="fly">перелёт</span> &nbsp; - - <span class="ground">наземный переезд</span></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const places = [
  {id:"sao", name:"Сан-Паулу, Бразилия", lat:-23.5505, lng:-46.6333, day:"День 1 · День 15–16",
   sights:[
     ["Музей искусств MASP (Авенида Паулиста)","https://masp.org.br"],
     ["Парк Ибирапуэра","https://en.wikipedia.org/wiki/Ibirapuera_Park"],
     ["Собор Се (Catedral da Sé)","https://en.wikipedia.org/wiki/S%C3%A3o_Paulo_Cathedral"]
   ]},
  {id:"lim", name:"Лима, Перу", lat:-12.0464, lng:-77.0428, day:"День 2",
   sights:[
     ["Парк Любви (Parque del Amor), Мирафлорес","https://en.wikipedia.org/wiki/Parque_del_Amor"],
     ["Исторический центр Лимы (ЮНЕСКО)","https://whc.unesco.org/en/list/500"],
     ["Пласа-Майор и монастырь Сан-Франсиско","https://en.wikipedia.org/wiki/Plaza_Mayor,_Lima"]
   ]},
  {id:"cus", name:"Куско, Перу", lat:-13.5319, lng:-71.9675, day:"День 3–4 · День 6",
   sights:[
     ["Кориканча (Храм Солнца)","https://en.wikipedia.org/wiki/Coricancha"],
     ["Крепость Саксайуаман","https://en.wikipedia.org/wiki/Sacsayhuam%C3%A1n"],
     ["Исторический центр Куско (ЮНЕСКО)","https://whc.unesco.org/en/list/273"]
   ]},
  {id:"oll", name:"Ольянтайтамбо, Священная долина", lat:-13.2584, lng:-72.2645, day:"День 4–5",
   sights:[
     ["Крепость Ольянтайтамбо","https://en.wikipedia.org/wiki/Ollantaytambo"],
     ["Руины Писак","https://en.wikipedia.org/wiki/P%C3%ADsac"],
     ["Рынок ремесленников Писак (фото)","https://www.google.com/search?q=Pisac+market&tbm=isch"]
   ]},
  {id:"mp", name:"Мачу-Пикчу, Перу", lat:-13.1631, lng:-72.545, day:"День 5–6",
   sights:[
     ["Мачу-Пикчу — официальный сайт (билеты)","https://www.machupicchu.gob.pe"],
     ["Мачу-Пикчу (ЮНЕСКО)","https://whc.unesco.org/en/list/274"],
     ["Гора Уайна-Пикчу","https://en.wikipedia.org/wiki/Huayna_Picchu"]
   ]},
  {id:"pun", name:"Пуно, оз. Титикака", lat:-15.8402, lng:-70.0219, day:"День 7–8",
   sights:[
     ["Плавучие острова Урос","https://en.wikipedia.org/wiki/Uru_people"],
     ["Озеро Титикака","https://en.wikipedia.org/wiki/Lake_Titicaca"],
     ["Погребальные башни Сильустани","https://en.wikipedia.org/wiki/Sillustani"]
   ]},
  {id:"lap", name:"Ла-Пас, Боливия", lat:-16.4897, lng:-68.1193, day:"День 8–9",
   sights:[
     ["Канатная дорога Mi Teleférico — официальный сайт","https://www.miteleferico.bo"],
     ["Площадь Мурильо","https://en.wikipedia.org/wiki/Plaza_Murillo"],
     ["Лунная долина (Valle de la Luna)","https://en.wikipedia.org/wiki/Valle_de_la_Luna_(Bolivia)"]
   ]},
  {id:"uyu", name:"Уюни, Боливия", lat:-20.4597, lng:-66.825, day:"День 9–11",
   sights:[
     ["Солончак Уюни","https://en.wikipedia.org/wiki/Salar_de_Uyuni"],
     ["Остров Инкауаси","https://en.wikipedia.org/wiki/Incahuasi_Island"],
     ["Резерват Эдуардо Авароа (лагуны, фламинго)","https://en.wikipedia.org/wiki/Eduardo_Avaroa_Andean_Fauna_National_Reserve"]
   ]},
  {id:"spd", name:"Сан-Педро-де-Атакама, Чили", lat:-22.9087, lng:-68.1999, day:"День 12–13",
   sights:[
     ["Гейзеры Эль-Татио","https://en.wikipedia.org/wiki/El_Tatio"],
     ["Лунная долина (Valle de la Luna)","https://en.wikipedia.org/wiki/Valle_de_la_Luna_(Chile)"],
     ["Резерват Лос-Фламенкос (фламинго)","https://en.wikipedia.org/wiki/Los_Flamencos_National_Reserve"]
   ]},
  {id:"scl", name:"Сантьяго, Чили", lat:-33.4489, lng:-70.6693, day:"День 13–15",
   sights:[
     ["Холм Санта-Лусия","https://en.wikipedia.org/wiki/Santa_Luc%C3%ADa_Hill"],
     ["Пласа-де-Армас и Кафедральный собор","https://en.wikipedia.org/wiki/Plaza_de_Armas_(Santiago)"],
     ["Парк Метрополитано (холм Сан-Кристобаль) — официальный сайт","https://www.parquemet.cl"]
   ]},
  {id:"val", name:"Вальпараисо, Чили", lat:-33.0472, lng:-71.6127, day:"День 14",
   sights:[
     ["Фуникулёры Вальпараисо","https://en.wikipedia.org/wiki/Funicular_railways_of_Valpara%C3%ADso"],
     ["Музей под открытым небом (Museo a Cielo Abierto)","https://en.wikipedia.org/wiki/Museo_a_Cielo_Abierto"],
     ["Исторический квартал Вальпараисо (ЮНЕСКО)","https://whc.unesco.org/en/list/959"]
   ]}
];

const flights = [
  ["sao","lim"],["lim","cus"],["lap","uyu"],["spd","scl"],["scl","sao"]
];
const ground = [
  ["cus","pun"],["pun","lap"],["uyu","spd"]
];
const byId = Object.fromEntries(places.map(p=>[p.id,p]));

const map = L.map('map').setView([-16.5,-66.5], 4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:'© OpenStreetMap', maxZoom:18
}).addTo(map);

function line(a,b,dash){ return L.polyline([[byId[a].lat,byId[a].lng],[byId[b].lat,byId[b].lng]],
  {color:dash?'#58a6ff':'#f0883e', weight:2.5, dashArray:dash?'6 8':null, opacity:.9}); }
flights.forEach(f=>line(f[0],f[1],false).addTo(map));
ground.forEach(g=>line(g[0],g[1],true).addTo(map));

function show(p){
  document.getElementById('p-day').textContent = p.day;
  document.getElementById('p-title').textContent = p.name;
  document.getElementById('p-list').innerHTML = p.sights
    .map(s=>`<li><a href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a></li>`).join('');
  document.getElementById('panel').style.display = 'block';
}

places.forEach(p=>{
  const m = L.circleMarker([p.lat,p.lng], {radius:8, color:'#0d1117', weight:2, fillColor:'#f0883e', fillOpacity:1})
    .addTo(map).bindPopup(`<b>${p.name}</b>`);
  m.on('click', ()=>show(p));
});

show(places[0]);
</script>
</body>
</html>
